name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite bakes VITE_* into the static bundle at build time.
      # Set these under: Repo → Settings → Secrets and variables → Actions
      - name: Typecheck
        run: npx tsc --noEmit

      # Vite prefers process env over .env.production. Empty Actions secrets become
      # "" and would wipe committed public client keys — only export non-empty values.
      #
      # Sentry source maps (optional): set SENTRY_AUTH_TOKEN + SENTRY_ORG + SENTRY_PROJECT.
      # Without them the build still succeeds; maps are not generated or uploaded.
      - name: Build
        env:
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SECRET_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SECRET_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SECRET_SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SECRET_SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SECRET_SENTRY_URL: ${{ secrets.SENTRY_URL }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Which vendor answers is a Supabase secret, never a build value —
          # every VITE_* is inlined into the public bundle. "proxy" only says
          # "route AI through the ai-generate function"; the function picks
          # the upstream from AI_UPSTREAM / AI_BASE_URL / AI_MODEL.
          # Restored after #87 accidentally blanked the value set in #77 —
          # empty string → createAIPortFromEnv falls through to noop, so the
          # live ai-generate function was unreachable from the shipped SPA.
          VITE_AI_PROVIDER: proxy
        run: |
          if [ -n "$SECRET_SUPABASE_URL" ]; then
            export VITE_SUPABASE_URL="$SECRET_SUPABASE_URL"
            echo "Using VITE_SUPABASE_URL from Actions secrets"
          else
            echo "::notice::VITE_SUPABASE_URL secret unset — Vite will use .env.production if present"
          fi
          if [ -n "$SECRET_SUPABASE_ANON_KEY" ]; then
            export VITE_SUPABASE_ANON_KEY="$SECRET_SUPABASE_ANON_KEY"
            echo "Using VITE_SUPABASE_ANON_KEY from Actions secrets"
          else
            echo "::notice::VITE_SUPABASE_ANON_KEY secret unset — Vite will use .env.production if present"
          fi
          # Publishable keys (sb_publishable_...) replace the legacy anon JWT.
          # The client prefers this one when both are set, so rotating is a
          # matter of adding this secret — no code change, no key removal first.
          if [ -n "$SECRET_SUPABASE_PUBLISHABLE_KEY" ]; then
            export VITE_SUPABASE_PUBLISHABLE_KEY="$SECRET_SUPABASE_PUBLISHABLE_KEY"
            echo "Using VITE_SUPABASE_PUBLISHABLE_KEY from Actions secrets"
          fi
          if [ -n "$SECRET_SENTRY_DSN" ]; then
            export VITE_SENTRY_DSN="$SECRET_SENTRY_DSN"
            echo "Using VITE_SENTRY_DSN from Actions secrets"
          else
            echo "::notice::VITE_SENTRY_DSN secret unset — Vite will use .env.production if present"
          fi
          if [ -n "$SECRET_SENTRY_AUTH_TOKEN" ] && [ -n "$SECRET_SENTRY_ORG" ] && [ -n "$SECRET_SENTRY_PROJECT" ]; then
            export SENTRY_AUTH_TOKEN="$SECRET_SENTRY_AUTH_TOKEN"
            # Trim CR/whitespace — common copy/paste bug that yields "Project not found"
            export SENTRY_ORG="$(printf '%s' "$SECRET_SENTRY_ORG" | tr -d '\r' | xargs)"
            export SENTRY_PROJECT="$(printf '%s' "$SECRET_SENTRY_PROJECT" | tr -d '\r' | xargs)"
            # Do NOT force us.sentry.io — tokens from sentry.io embed that host and refuse US.
            # Optional override only: secret SENTRY_URL
            if [ -n "$SECRET_SENTRY_URL" ]; then
              export SENTRY_URL="$(printf '%s' "$SECRET_SENTRY_URL" | tr -d '\r' | xargs)"
            else
              unset SENTRY_URL || true
            fi
            echo "Sentry source-map upload enabled (org=$SENTRY_ORG project=$SENTRY_PROJECT release=$VITE_SENTRY_RELEASE url=${SENTRY_URL:-token-default})"
            echo "Sentry org length=${#SENTRY_ORG} project length=${#SENTRY_PROJECT}"
            # List projects the token can see (slugs only — helps verify secrets without exposing the token)
            npx --yes @sentry/cli projects list --org "$SENTRY_ORG" 2>&1 | head -40 || echo "::warning::Could not list Sentry projects (token host/scopes or org slug)"
          else
            echo "::notice::Sentry upload skipped — set SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT for readable stack traces"
          fi
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
